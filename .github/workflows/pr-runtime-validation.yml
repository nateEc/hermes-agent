name: PR runtime validation

on:
  push:
    branches: ['codex/runtime-validation-windows']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-launchers:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: 6fae5c4681bb913a48d3d60039a159c556d7cb96
          fetch-depth: 0
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
      - name: Execute native Unicode launchers including CP437
        shell: bash
        run: |
          bash scripts/run_tests.sh tests/hermes_cli/test_gateway_windows.py -k test_native_unicode_launcher_runs_in_requested_home --fail-on-skip -v -j 1
      - name: Execute launcher and service identity regressions
        shell: bash
        run: |
          bash scripts/run_tests.sh tests/hermes_cli/test_gateway_windows.py tests/hermes_cli/test_gateway_runtime_service.py -q -j 2
      - name: Compare native launcher probes with the unfixed base
        shell: bash
        run: |
          cp tests/hermes_cli/test_gateway_windows.py "$RUNNER_TEMP/gateway_windows_probes.py"
          git checkout fe0e58b67f2c1f09e853845cd7d2b8e4c737857f
          cp "$RUNNER_TEMP/gateway_windows_probes.py" tests/hermes_cli/test_gateway_windows.py
          set +e
          HERMES_TEST_FILE_RETRIES=0 bash scripts/run_tests.sh tests/hermes_cli/test_gateway_windows.py -k test_native_unicode_launcher_runs_in_requested_home -q -j 2
          result=$?
          echo "Current-main native probe exit code: $result (CMD must fail; VBS is already fixed)"
          test "$result" -eq 1
